services:
  postgres:
    image: postgres:17-alpine
    container_name: stayhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stayhub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stayhub_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-stayhub_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stayhub_user} -d ${POSTGRES_DB:-stayhub_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
